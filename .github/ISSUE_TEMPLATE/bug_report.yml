name: Bug report
description: Something in Scout doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the query you typed, what you expected and what Scout did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Scout version
      placeholder: 0.1.0-beta.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options: [Installer, Portable ZIP, Built from source]
  - type: dropdown
    id: ai
    attributes:
      label: Local AI
      options: [Off, CPU, CUDA]
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: markdown
    attributes:
      value: Please don't paste personal file paths or browser history. Anonymize names where you can.
